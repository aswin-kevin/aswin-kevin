name: 🌌 Cosmos Sync

on:
  schedule:
    - cron: "17 12 * * *" # daily, 12:17 UTC (after NASA posts the new APOD)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/cosmos.yml"]

permissions:
  contents: write

concurrency:
  group: cosmos-sync
  cancel-in-progress: false

jobs:
  telemetry:
    name: 🛰️ APOD + mission control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🔭 Astronomy Picture of the Day
        continue-on-error: true
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python scripts/apod.py

      - name: 📡 Mission control telemetry
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/mission_control.py

      - name: 🚀 Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/mission-control.svg
          if git diff --staged --quiet; then
            echo "Nothing changed in orbit."
          else
            git commit -m "🛰️ daily cosmos sync"
            git pull --rebase
            git push
          fi

  comet:
    name: ☄️ Contribution comet
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/comet-dark.svg?palette=github-dark&color_snake=#f0f6fc&color_dots=#161b22,#0c2d6b,#1158c7,#388bfd,#a5d6ff
            dist/comet-light.svg?color_snake=#0969da&color_dots=#ebedf0,#cae8ff,#79c0ff,#388bfd,#1f6feb

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
