name: 🌌 Cosmos Sync

on:
  schedule:
    - cron: "17 12 * * *" # daily, 12:17 UTC (after NASA posts the new APOD)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/cosmos.yml"]

permissions:
  contents: write

concurrency:
  group: cosmos-sync
  cancel-in-progress: false

jobs:
  sync:
    name: 🛰️ APOD, telemetry & skyline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_LOGIN: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Each generator is independent: one failing must not block the others,
      # but the run is still marked failed at the end so breakage is visible.
      - name: 🔭 Astronomy Picture of the Day
        id: apod
        run: python scripts/apod.py

      - name: 📡 Mission control telemetry
        id: telemetry
        if: ${{ !cancelled() }}
        run: python scripts/mission_control.py

      - name: 🏙️ Contribution skyline
        id: skyline
        if: ${{ !cancelled() }}
        run: python scripts/skyline.py

      - name: 🚀 Commit changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/mission-control.svg assets/contribution-skyline.svg
          if git diff --staged --quiet; then
            echo "Nothing changed in orbit."
            exit 0
          fi
          git commit -m "🛰️ daily cosmos sync"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "Push attempt $attempt failed; retrying…"
            sleep $((attempt * 5))
          done
          exit 1

      - name: 🚨 Fail if any generator failed
        if: ${{ !cancelled() && (steps.apod.outcome == 'failure' || steps.telemetry.outcome == 'failure' || steps.skyline.outcome == 'failure') }}
        run: |
          echo "apod=${{ steps.apod.outcome }} telemetry=${{ steps.telemetry.outcome }} skyline=${{ steps.skyline.outcome }}"
          exit 1
